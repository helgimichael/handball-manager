<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Handball Manager — visual comparison</title>
<style>body{margin:0;background:#101b2e;color:#f4f0e6;font:14px "Segoe UI",sans-serif}main{padding:24px;max-width:2400px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-bottom:24px}h1{font-size:24px;margin:0}p{color:#aebccc}nav{display:flex;gap:8px;flex-wrap:wrap}button{font:inherit;color:inherit;background:#25334a;border:1px solid #516079;padding:9px 15px;cursor:pointer}button[aria-pressed=true]{background:#c74624;border-color:#c74624}button:focus-visible{outline:2px solid #ffd4ad;outline-offset:3px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:20px}.pair figure{margin:0;min-width:0}.pair img{display:block;width:100%;height:auto;border:1px solid #43516a;box-sizing:border-box}figcaption{font-weight:600;font-size:12px;letter-spacing:.08em;margin-bottom:12px;color:#d6c8b6;text-transform:uppercase}.controls{display:flex;justify-content:space-between;gap:24px;margin-bottom:24px}small{color:#aebccc}@media(max-width:900px){header,.controls{display:block}nav{margin:14px 0}.pair{grid-template-columns:1fr}}</style>
<main><header><div><h1>Handball Manager · Game Experience v1</h1><p>Same club, starting date and routes. Actual Chromium captures.</p></div><small>Before: ad603fc · After: Game Experience v1</small></header><div class="controls"><nav aria-label="Screen"><button data-screen="home" aria-pressed="true">Home</button><button data-screen="squad" aria-pressed="false">Squad</button><button data-screen="player" aria-pressed="false">Player</button><button data-screen="search" aria-pressed="false">Player search</button><button data-screen="competition" aria-pressed="false">Competition</button></nav><nav aria-label="Viewport"><button data-width="1920" aria-pressed="true">1920 × 1080</button><button data-width="2560" aria-pressed="false">2560 × 1080</button></nav></div><div class="pair"><figure><figcaption>Before · Management Experience v1</figcaption><a id="before-link" href="before/1920/home.png"><img id="before" src="before/1920/home.png" alt="Home before the redesign"></a></figure><figure><figcaption>After · Game Experience v1</figcaption><a id="after-link" href="after/1920/home.png"><img id="after" src="after/1920/home.png" alt="Home after the redesign"></a></figure></div><p>Open either image for its full-resolution capture. Screens preserve the useful data; the composition, identity and sporting hierarchy have changed.</p></main>
<script>let screen='home',width='1920';function render(){for(const phase of ['before','after']){const url=`${phase}/${width}/${screen}.png`;document.getElementById(phase).src=url;document.getElementById(phase).alt=`${screen} ${phase} the redesign at ${width} pixels`;document.getElementById(`${phase}-link`).href=url;}document.querySelectorAll('[data-screen]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.screen===screen)));document.querySelectorAll('[data-width]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.width===width)));}document.querySelectorAll('[data-screen]').forEach(b=>b.onclick=()=>{screen=b.dataset.screen;render();});document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>{width=b.dataset.width;render();});</script></html>
