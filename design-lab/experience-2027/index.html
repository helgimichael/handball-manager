<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
<header class="lab-top">
  <div class="lab-brand"><span class="lab-logo">HM</span><span><b>Design Lab</b><small>Experience 2027 · isolated prototype — not production</small></span></div>
  <nav class="lab-views" id="views" aria-label="Lab views"></nav>
  <div class="lab-ctl">
    <label class="lab-field"><span>Identity</span><select id="identity" aria-label="Design identity"><option value="a">A · Tactical Clarity</option><option value="b">B · Arena Nights (owner)</option><option value="c">C · Paper &amp; Floodlight</option></select></label>
    <label class="lab-field"><span>Club</span><select id="club" aria-label="Active club (Club Identity System)"><option value="tum">IFK Tumba · neon blue</option><option value="ham">Hammarby · neon green</option><option value="none">Utan klubb · neon orange</option></select></label>
    <div class="lab-seg" id="navmode" role="group" aria-label="Navigation structure" title="Recommended = Week Spine + hub rail (ENT-07/08). Identity = the identity's original shell."><button data-v="rec">Nav: recommended</button><button data-v="ident">Nav: identity</button></div>
    <div class="lab-seg" id="device" role="group" aria-label="Preview device"><button data-v="desktop">Desktop</button><button data-v="tablet">Tablet</button><button data-v="mobile">Mobile</button></div>
    <div class="lab-seg" id="density" role="group" aria-label="Density"><button data-v="">Comfort</button><button data-v="compact">Compact</button></div>
  </div>
</header>
<main id="app" class="lab-main"></main>
<div id="lab-toast" class="lab-toast" role="status"></div>
